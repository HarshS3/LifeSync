pluginManagement {
  def reactNativeGradlePluginPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePluginPath)
}

plugins {
  id("com.facebook.react.settings")
}

def reactNativeGradlePluginPath = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
  }.standardOutput.asText.get().trim()
).getParentFile().absolutePath

def reactNativeDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim()
).getParentFile()

def expoAutolinkingScript = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('expo/scripts/autolinking.gradle', { paths: [require.resolve('expo/package.json')] })")
  }.standardOutput.asText.get().trim()
)

def expoAutolinkingCommand = [
  "node",
  "--no-warnings",
  "--eval",
  "require(require.resolve('expo-modules-autolinking', { paths: [require.resolve('expo')] }))(process.argv.slice(1))",
  "--",
  "react-native-config",
  "--json",
  "--platform",
  "android",
  "--project-root",
  rootDir.getParentFile().absolutePath
]

dependencyResolutionManagement {
  versionCatalogs {
    expoLibs {
      from(files(new File(reactNativeDir, "gradle/libs.versions.toml")))
    }
  }
}

apply from: expoAutolinkingScript

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    ex.autolinkLibrariesFromCommand(expoAutolinkingCommand, rootDir.getParentFile())
  }
}
useExpoModules()

rootProject.name = 'app'

include ':app'
includeBuild(reactNativeGradlePluginPath)
